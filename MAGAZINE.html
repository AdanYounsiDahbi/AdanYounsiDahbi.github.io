<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Page Web Colorée</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            background-color: #000000; /* Bleu clair */
        }
        header {
            text-align: center;
            margin-top: 20px;
           
            color: rgb(255, 255, 255); /* Texte blanc */
            padding: 10px;
            border-radius: 10px;
        }
        footer {
            margin-bottom: 20px;
          
            color: rgb(0, 0, 0); /* Texte blanc */
            padding: 10px;
            border-radius: 10px;
        }
        img {
            width: 410px;
            height: auto;
            margin: 1px;
        }
    </style>
</head>
<body>
    <header>
        <h1>SCIENCE MAG</h1>
        <h2>Projet journal hebdomadaire</h2>
        <h4>
            Ce magazine met en avant des observations au microscope 
            de choses du quotidien, s'ajoute à cela une information 
            de culture générale sur le sujet observé.</h4>
        <h3> Magazine de 34 page au format A4
        </h3>
    </header>

    <footer>
        <img src="mag 1.jpg" 
        alt="Exemple d'image 1">

        alt="Exemple d'image 3">

        alt="Exemple d'image 3">

        alt="Exemple d'image 3">

        alt="Exemple d'image 3">
        
       
        <img src="mag 7.png" 
        alt="Exemple d'image 3">
       
        <img src="mag 8.png"
        alt="Exemple d'image 3">

        <img src="mag 9.png"
        alt="Exemple d'image 3">

        <img src="mag 10.png"
        alt="Exemple d'image 3">

        <img src="mag 11.png"
        alt="Exemple d'image 3">
        
        <img src="mag 12.png"
        alt="Exemple d'image 3">

        <img src="mag 13.png"
        alt="Exemple d'image 3">

</html>
